[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Bandit is not configured here on purpose. The security gate passes explicit
# production targets on the command line (see security_gate/bandit_control.py),
# so the scan surface cannot be widened or narrowed by editing a config file.
