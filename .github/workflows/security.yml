name: Security pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest

      - name: Run Bandit
        run: python -m bandit -r app.py -f json -o bandit-report.json

      - name: Run dependency audit
        run: python -m pip_audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Run secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow permissions
        run: python -c "from pathlib import Path; text=Path('.github/workflows/security.yml').read_text(); assert 'permissions:' in text and 'contents: read' in text"

      - name: Publish scanner reports
        if: always()
        uses: actions/upload-artifact@a167fd8e922f413eeb5cb6a6b3758e2d7ae4b353 # v4.6.2
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn
