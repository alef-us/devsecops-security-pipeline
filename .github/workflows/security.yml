name: Security pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest

      - name: Run security gate
        run: python -m security_gate --summary-file security-summary.md

      - name: Run secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow permissions
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/security.yml").read_text(encoding="utf-8")
          assert "permissions:" in text, "workflow must declare explicit permissions"
          assert "contents: read" in text, "workflow must use read-only contents access"
          print("workflow permission check passed")
          PY

      - name: Publish scanner reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            security-summary.md
          if-no-files-found: warn
