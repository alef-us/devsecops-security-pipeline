name: Security pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning needs the full history: removing a credential from
          # the latest commit does not remove it from earlier commits.
          fetch-depth: 0
          # Do not leave the job token in .git/config, where a later step or an
          # uploaded artifact could expose it. No step here pushes to the repo.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Checksum published with the release. The install fails closed if the
          # downloaded archive does not match.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/tools"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/tools" gitleaks
          chmod +x "${RUNNER_TEMP}/tools/gitleaks"
          rm -f "${archive}"
          echo "${RUNNER_TEMP}/tools" >> "${GITHUB_PATH}"

      - name: Run application tests
        run: python -m pytest

      - name: Run security gate
        run: python -m security_gate --summary-file security-summary.md

      - name: Publish scanner reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            security-summary.md
          if-no-files-found: warn
