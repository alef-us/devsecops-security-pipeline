name: CodeQL

# CodeQL complements Bandit rather than duplicating it: Bandit matches known-bad
# patterns in a single file, while CodeQL performs data-flow analysis across the
# whole project and can follow untrusted input from an entry point to a sink.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A weekly run catches newly published queries for code that has not changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required to upload the analysis results to the code scanning API.
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          # security-and-quality is broader than the default suite. The project
          # is small, so the extra findings are reviewable rather than noise.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python
